# Production stack: the app behind Caddy, which terminates TLS and renews certificates.
#
#   DOMAIN=votecheck.fi [email protected] docker compose -f docker-compose.prod.yml up -d --build
#
# The app publishes no port of its own — only Caddy is reachable from outside, and it
# reaches the app over the internal network. That is also why BehindProxy is on: the app
# receives plain http from Caddy and must be told the public scheme is https, or every
# permalink it emits advertises the wrong one.

services:
  votecheck:
    build:
      context: .
      dockerfile: VoteCheckWeb/Dockerfile
    expose:
      - "8080"
    volumes:
      - votecheck-data:/data
    environment:
      VoteCheck__BehindProxy: "true"
      VoteCheck__SyncMinYear: "2023"
      # Same-origin only unless a separate client needs it:
      # VoteCheck__AllowedOrigins__0: "https://app.example.org"
    restart: unless-stopped
    healthcheck:
      # bash, not CMD-SHELL: /dev/tcp is a bash feature and /bin/sh on this Debian-based
      # runtime image is dash, which reports "cannot create /dev/tcp/..." and marks a
      # perfectly healthy container unhealthy forever. The image ships no curl or wget,
      # which is why the check is a hand-rolled request in the first place.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing on next start,
      # which is fine but counts against Let's Encrypt rate limits if it happens often.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. DOMAIN=votecheck.fi}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL - the Caddyfile's global email directive has no valid empty form}
    depends_on:
      - votecheck
    restart: unless-stopped

volumes:
  # The mirror. Rebuildable from the API, but a rebuild is ~2,800 upstream requests,
  # so treat losing it as rude rather than harmless.
  votecheck-data:
  caddy-data:
  caddy-config:
